name: Verify RR Capital

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run synthetic-backend browser tests
        run: npm run test:e2e

      - name: Build production app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci-build-placeholder' }}
        run: npm run build
