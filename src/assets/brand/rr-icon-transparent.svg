<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Premium Navy Gradient for the continuous line -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A47" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Subtle drop shadow to give the mark a high-end app feel -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Solid App-Style Background with Rounded Corners -->

  <!-- Centered Favicon Logo Mark -->
  <!-- Scaled and translated to fit perfectly in the 256x256 square -->
  <g transform="translate(-22, -22) scale(0.75)" filter="url(#shadow)">
    <path d="M 120 100
             C 150 100, 170 170, 200 200
             C 120 200, 120 320, 200 320
             L 200 80
             C 280 80, 280 200, 200 200
             C 230 230, 250 300, 280 300"
          fill="none"
          stroke="url(#navyGradient)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
